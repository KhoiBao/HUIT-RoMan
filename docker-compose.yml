name: huit-roman

services:
  db:
    image: postgres:16-alpine
    container_name: huit-roman-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-LibraryDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc dat trong file .env}
    ports:
      # 5433 ở máy host để không đụng PostgreSQL local thường dùng 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: huit-roman-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-LibraryDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc dat trong file .env}"
      JwtSettings__Secret: ${JWT_SECRET:?JWT_SECRET chua duoc dat trong file .env}
      JwtSettings__Issuer: HUIT-RoMan-API
      JwtSettings__Audience: HUIT-RoMan-Client
      Database__AutoMigrate: "true"
      SmtpSettings__UserName: ${SMTP_USER:-}
      SmtpSettings__Password: ${SMTP_PASSWORD:-}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME:-}
      SmtpSettings__EnableEmail: ${SMTP_ENABLE_EMAIL:-true}
      StorageSettings__Endpoint: ${MINIO_ENDPOINT:-minio:9000}
      StorageSettings__AccessKey: ${MINIO_ROOT_USER:?MINIO_ROOT_USER chua duoc dat trong file .env}
      StorageSettings__SecretKey: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD chua duoc dat trong file .env}
      StorageSettings__BucketName: ${MINIO_BUCKET_NAME:-violations}
      StorageSettings__UseSsl: "false"
    ports:
      - "${API_PORT:-5056}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    container_name: huit-roman-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: huit-roman-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER chua duoc dat trong file .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD chua duoc dat trong file .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
